<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English for Business eMBA</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1d2330;--muted:#6b7280;--line:#e5e1d8;--accent:#1f5f8b;--accent2:#e8f1f8;--good:#1e7a46;--goodbg:#e7f5ec;--bad:#b3261e;--badbg:#fbeaea;--warn:#8a5a00;--warnbg:#fff5dc;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--panel:#1d2128;--ink:#e8e9ec;--muted:#9aa1ad;--line:#2d333d;--accent:#6fb3e0;--accent2:#1c2a37;--good:#5fcf8f;--goodbg:#173226;--bad:#ff8a80;--badbg:#3a1e1e;--warn:#f0c060;--warnbg:#33290f;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--panel:#1d2128;--ink:#e8e9ec;--muted:#9aa1ad;--line:#2d333d;--accent:#6fb3e0;--accent2:#1c2a37;--good:#5fcf8f;--goodbg:#173226;--bad:#ff8a80;--badbg:#3a1e1e;--warn:#f0c060;--warnbg:#33290f;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
a{color:var(--accent)}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
#side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:18px 12px}
.brand{font-weight:700;font-size:17px;padding:0 8px 4px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
#nav a{display:block;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px}
#nav a:hover{background:var(--accent2)}#nav a.active{background:var(--accent);color:#fff}
.navh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px}
.navfoot{margin-top:18px;padding:0 10px}.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px;padding:0}
#topbar{display:none}
main{padding:28px 36px 60px;max-width:1000px;width:100%;min-width:0;overflow-wrap:anywhere}
h1{font-size:28px;line-height:1.25;margin:0 0 10px}h1 .vn{font-weight:400;color:var(--muted);font-size:18px}
h2.sec{margin:34px 0 12px;font-size:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:14px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:17.5px}
.hero{background:linear-gradient(135deg,var(--accent),#2f7a6b);color:#fff;border-radius:18px;padding:28px 30px}
.hero h1{font-size:34px;color:#fff}.kicker{margin:0;opacity:.85;font-size:14px}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}.stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 16px;min-width:140px}.stats b{display:block;font-size:22px}.stats span{font-size:13px;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ucard{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);transition:transform .12s}
.ucard:hover{transform:translateY(-2px);border-color:var(--accent)}
.ucard h3{margin:2px 0 0;font-size:18px}.ucard .vn{margin:0;color:var(--accent);font-size:14px}.ucard .goal{font-size:13.5px;color:var(--muted);margin:8px 0 10px}
.unum{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
small,.muted{color:var(--muted);font-size:13.5px}.center{text-align:center}
.uhead .goal{color:var(--muted);margin:0 0 6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 6px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600;font-size:15px}
.tabs a.on{color:var(--accent);border-color:var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.seg a{padding:4px 12px;border:1px solid var(--line);border-radius:99px;text-decoration:none;color:var(--ink);font-size:14px;background:var(--panel)}.seg a.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{background:var(--accent2);border-radius:10px;padding:10px 14px;font-size:14.5px}
.tip{background:var(--warnbg);color:var(--ink);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;font-size:14.5px}
.warn{background:var(--warnbg);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px}
.formula{background:var(--accent2);font-weight:700;text-align:center;padding:10px;border-radius:8px;margin:8px 0}
table.t{border-collapse:collapse;width:100%;font-size:14.5px;margin:8px 0;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}table.t th{background:var(--accent2)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.toc a{font-size:13px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;text-decoration:none;background:var(--panel);color:var(--ink)}
.ex header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badge{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}.badge.ok{background:var(--goodbg);color:var(--good)}
.intro{color:var(--muted);margin:0 0 6px;font-size:14.5px}
ol.items{padding-left:0;list-style:none;margin:8px 0;counter-reset:it}
.row{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,40%);gap:6px 12px;align-items:center}
.row.ok{border-color:var(--good);background:var(--goodbg)}.row.no{border-color:var(--bad);background:var(--badbg)}
.row .fb{grid-column:1/-1;font-size:14px}.row .fb:empty{display:none}
.row.open{display:block}
.row:has(.opts){grid-template-columns:1fr}
.inputs{display:flex;gap:6px;flex-wrap:wrap}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0;max-width:100%}
.inputs input{flex:1 1 140px}
input.good{border-color:var(--good);background:var(--goodbg)}input.bad{border-color:var(--bad)}
textarea{margin:6px 0;resize:vertical}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--panel)}
.opt.right{border-color:var(--good);background:var(--goodbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.okt{color:var(--good);font-weight:600}.not{color:var(--bad)}
.exp{color:var(--ink);opacity:.9;margin-top:3px}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14.5px}
.model{background:var(--accent2);border-radius:8px;padding:10px 12px;margin-top:6px;font-size:15px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-size:14.5px;font-weight:600;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.ghost{background:transparent}
.btn.good{border-color:var(--good);color:var(--good)}.btn.bad{border-color:var(--bad);color:var(--bad)}.btn.big{padding:11px 22px;font-size:16px}
.score{font-weight:700}
.spk{background:none;border:0;cursor:pointer;font-size:15px;padding:0 3px;vertical-align:middle}
.pager{display:flex;justify-content:space-between;margin-top:24px}
.vtools{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.vrow{display:grid;grid-template-columns:1.2fr 1fr 1.6fr auto;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);font-size:14.5px;align-items:center}
.vw i{color:var(--muted);font-size:12.5px}.ve{color:var(--muted)}
.fcwrap{max-width:560px;margin:10px auto}
.flash{position:relative;height:250px;margin:14px 0;perspective:1000px;cursor:pointer;outline:none}
.flash .front,.flash .back{position:absolute;inset:0;border-radius:18px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;backface-visibility:hidden;transition:transform .45s}
.flash .back{transform:rotateY(180deg);background:var(--accent2)}
.flash.flipped .front{transform:rotateY(180deg)}.flash.flipped .back{transform:rotateY(360deg)}
.fw{font-size:30px;font-weight:700}.fp{color:var(--muted)}.hint{color:var(--muted);font-size:12.5px;margin-top:20px}
.fv{font-size:24px;font-weight:700;color:var(--accent)}.fe{margin-top:10px;font-style:italic}
.fcbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quiz .qtop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px}
.qq{font-size:19px;font-weight:600;margin:12px 0}
.qopts{display:grid;gap:8px}.qopt{font:inherit;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.qopt:hover:not(:disabled){border-color:var(--accent)}.qopt.right{border-color:var(--good);background:var(--goodbg)}.qopt.wrong{border-color:var(--bad);background:var(--badbg)}
.qtype{display:flex;gap:8px}.qfb{margin-top:12px}.qfb .btn{margin-top:10px}
.review li{margin:10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;list-style-position:inside}
.examset{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}.chk{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.examset select{width:auto}
.tips ol{margin:0;padding-left:20px}.tips li{margin:6px 0}
@media (max-width:860px){
 .layout{grid-template-columns:minmax(0,1fr)}
 #side{position:fixed;z-index:20;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.3)}
 body.navopen #side{transform:none}
 #topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px}
 #menuBtn{font-size:20px;background:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;color:var(--ink)}
 main{padding:18px 16px 50px}
 .row{grid-template-columns:minmax(0,1fr)}
 .vrow{grid-template-columns:1fr;gap:2px}
 h1{font-size:23px}.hero{padding:20px}.hero h1{font-size:27px}
}
</style>
</head>
<body>
<div id="topbar"><button id="menuBtn" aria-label="Menu">☰</button><b>English for Business · eMBA</b></div>
<div class="layout">
  <aside id="side"><div class="brand">English for Business<small>eMBA · Đại học Thương Mại · 2026</small></div><nav id="nav"></nav></aside>
  <main id="main"></main>
</div>
<script>
/* Nội dung Unit 1–4. Cấu trúc bài tập:
   fill  : items[{q, a:[blank1, blank2...], ex}]  — mỗi blank có thể có nhiều đáp án, ngăn bởi "|"
   match : items[{l, r, ex}]  (+ extra: các lựa chọn gây nhiễu)
   mcq   : items[{q, o:[...], a: index, ex}]
   open  : items[{q, model}]  — câu hỏi mở, có bài mẫu
*/
window.UNITS = window.UNITS || [];

/* ===================== UNIT 1 ===================== */
UNITS.push({
  id: 1, title: "Economic Indicators", vn: "Các chỉ số kinh tế",
  goal: "Hiểu và gọi đúng tên các chỉ số kinh tế (GDP, lạm phát, lãi suất, tỷ giá, cán cân thương mại…), đọc bảng số liệu và mô tả xu hướng tăng/giảm bằng tiếng Anh.",
  concepts: [
    { h: "1. Chỉ số kinh tế (economic indicators) là gì?",
      body: `<p>Là các <b>con số "đo sức khoẻ" của một nền kinh tế</b>. Giống như bác sĩ đo nhiệt độ, huyết áp, nhà kinh tế nhìn vào các chỉ số để biết nền kinh tế đang khoẻ hay yếu.</p>
      <table class="t"><tr><th>Chỉ số</th><th>Nghĩa</th><th>Ý nghĩa thực tế</th></tr>
      <tr><td><b>Population</b></td><td>Dân số</td><td>Quy mô thị trường, lực lượng lao động</td></tr>
      <tr><td><b>GDP</b> (Gross Domestic Product)</td><td>Tổng sản phẩm <u>trong nước</u></td><td>"Quy mô" nền kinh tế – the total size of an economy</td></tr>
      <tr><td><b>Growth rate</b></td><td>Tốc độ tăng trưởng</td><td>GDP tăng bao nhiêu % mỗi năm – the rate of expansion</td></tr>
      <tr><td><b>Inflation</b></td><td>Lạm phát</td><td>Giá cả tăng – the movement of prices</td></tr>
      <tr><td><b>Interest rate</b></td><td>Lãi suất</td><td>Chi phí đi vay – the cost of borrowing money</td></tr>
      <tr><td><b>Unemployment rate</b></td><td>Tỷ lệ thất nghiệp</td><td>% người không có việc làm</td></tr>
      <tr><td><b>Exchange rate</b></td><td>Tỷ giá hối đoái</td><td>Giá trị đồng tiền so với USD…</td></tr>
      <tr><td><b>Balance of trade</b></td><td>Cán cân thương mại</td><td>Xuất khẩu – Nhập khẩu</td></tr></table>`},
    { h: "2. Phân biệt các cặp dễ nhầm (hay ra thi!)",
      body: `<ul>
      <li><b>GDP vs GNP</b>: GDP = giá trị sản xuất <u>trong lãnh thổ</u> một nước (within a country's borders), bất kể ai làm ra. GNP = giá trị do <u>công dân</u> nước đó làm ra (by its nationals), dù ở đâu. <i>Mẹo: Domestic = trong nước (lãnh thổ), National = người mang quốc tịch.</i></li>
      <li><b>Surplus vs Deficit</b>: Surplus (thặng dư) = xuất khẩu &gt; nhập khẩu. Deficit (thâm hụt) = xuất khẩu &lt; nhập khẩu. Số âm trong cán cân thương mại (vd. US$ -12.54bn) = <b>deficit</b>.</li>
      <li><b>Base rate vs Interest rate vs Mortgage rate</b>: Base rate = lãi suất cơ bản do <u>Ngân hàng Trung ương</u> đặt ra. Interest rate = lãi suất nói chung (% khoản vay phải trả mỗi năm). Mortgage rate = lãi suất vay <u>mua nhà</u>.</li>
      <li><b>RPI / CPI</b>: chỉ số giá bán lẻ / giá tiêu dùng – đo sự thay đổi giá của một "giỏ hàng hoá" (basket of goods) cố định ⇒ dùng để đo lạm phát.</li></ul>`},
    { h: "3. Bản chất: các chỉ số liên quan với nhau thế nào?",
      body: `<ul>
      <li>Lạm phát cao ⇒ Ngân hàng TW <b>tăng lãi suất</b> để "hạ nhiệt" (vay đắt hơn ⇒ người dân chi tiêu ít ⇒ giá giảm bớt).</li>
      <li>Lãi suất cao ⇒ <b>tốt cho người gửi tiền, xấu cho người đi vay (borrowers)</b> và doanh nghiệp.</li>
      <li>Tăng trưởng âm (negative growth, vd. -5.8%) ⇒ suy thoái (recession) ⇒ thất nghiệp thường tăng.</li>
      <li>Thâm hụt thương mại lớn ⇒ nước đó phụ thuộc nhập khẩu, đồng tiền có thể mất giá.</li></ul>
      <p class="tip">Khi đề hỏi "Which has the better interest rates <b>for borrowers</b>?" ⇒ chọn nước có lãi suất <b>THẤP</b> hơn.</p>`},
    { h: "4. Ngôn ngữ mô tả xu hướng (describing trends) – TRỌNG TÂM",
      body: `<table class="t"><tr><th>Tăng ↑</th><th>Giảm ↓</th></tr>
      <tr><td>rise – rose – risen<br>increase<br>go up – went up<br>grow, climb</td><td>fall – fell – fallen<br>decrease<br>go down – went down<br>drop, decline</td></tr></table>
      <p><b>Trạng từ chỉ mức độ</b> (đặt SAU động từ):</p>
      <ul><li>Thay đổi <b>lớn</b>: <b>sharply, steeply, dramatically</b></li>
      <li>Thay đổi <b>nhỏ</b>: <b>slightly</b></li>
      <li>Thay đổi <b>liên tục, đều đặn</b>: <b>steadily</b></li></ul>
      <p><b>Giới từ với số liệu</b>:</p>
      <ul><li><b>from</b> 4.5% <b>to</b> 5% (từ… đến…)</li><li>go up <b>by</b> 0.5% (tăng <u>thêm</u> 0.5% – lượng thay đổi)</li><li>increase <b>to</b> 3.4% (tăng <u>lên mức</u> 3.4%)</li></ul>
      <p><b>Chuyển sang danh từ</b>: rise sharply → <i>a sharp rise</i>; fall slightly → <i>a slight fall</i>; increase steadily → <i>a steady increase</i>.</p>
      <p class="tip">Ví dụ chuẩn: "Inflation <b>rose sharply from</b> 1.8% in January <b>to</b> 3.4% in August." / "There was <b>a slight fall in</b> unemployment."</p>`}
  ],
  readings: [
    { t: "Reading 1 – Interpreting data (Turkey vs Poland)", s: `<p>Bảng so sánh 8 chỉ số của Thổ Nhĩ Kỳ và Ba Lan:</p>
      <table class="t"><tr><th>Indicator</th><th>Turkey</th><th>Poland</th></tr>
      <tr><td>a Population</td><td>76.8m</td><td>38.4m</td></tr>
      <tr><td>b GDP</td><td>US$ 861.6bn</td><td>US$ 686.2bn</td></tr>
      <tr><td>c Growth rate</td><td>-5.8%</td><td>1.1%</td></tr>
      <tr><td>d Interest rates</td><td>25%</td><td>5.0%</td></tr>
      <tr><td>e Unemployment</td><td>14.6%</td><td>11.0%</td></tr>
      <tr><td>f Inflation</td><td>5.9%</td><td>3.4%</td></tr>
      <tr><td>g Exchange rate</td><td>US$1 = YTL 1.55</td><td>US$1 = PLN 3.1</td></tr>
      <tr><td>h Balance of trade</td><td>US$ -12.54bn</td><td>US$ -3.585bn</td></tr></table>
      <p><b>Đọc hiểu nhanh:</b> Thổ Nhĩ Kỳ <u>lớn hơn</u> (GDP, dân số) nhưng <u>yếu hơn</u> ở hầu hết chỉ số: tăng trưởng âm, lãi suất rất cao (25%), thất nghiệp cao, lạm phát cao hơn, thâm hụt thương mại lớn.</p>`},
    { t: "Reading 2 – Life in modern Britain (1957 vs 2007)", s: `<p>Khảo sát chi tiêu gia đình Anh (Family Spending Survey):</p>
      <ul><li><b>1957</b>: thực phẩm + nhiên liệu + tiền thuê nhà ≈ 50% chi tiêu; thêm quần áo, đi lại ≈ 70%. "Xa xỉ" chính: thuốc lá + rượu (~10%); ăn nhà hàng 3%.</li>
      <li><b>2007</b>: thu nhập tăng gấp đôi (in real terms). Thực phẩm chỉ còn <b>15%</b> (từ 33%), một nửa trong đó là ăn ngoài/đồ mang về. Nhà ở tăng từ 9% lên <b>19%</b>. Giải trí (leisure) <b>7%</b>, quần áo <b>5%</b>. Đi lại tăng mạnh 8% → <b>16%</b> (3/4 gia đình có ô tô). Rượu vẫn 3%; thuốc lá giảm 6% → 1%.</li></ul>
      <p><b>Bản chất:</b> khi thu nhập tăng, tỷ trọng chi cho nhu yếu phẩm (ăn uống) <u>giảm</u>, chi cho nhà ở, đi lại, giải trí <u>tăng</u> (quy luật Engel).</p>`}
  ],

UNITS.push({
  id: 8, title: "Culture", vn: "Văn hoá trong kinh doanh",
  goal: "Hiểu các khía cạnh văn hoá theo Hofstede, từ vựng mô tả văn hoá, tính từ + giới từ, kể chuyện quá khứ (narrative tenses) và các cụm nối khi kể sự việc.",
  concepts: [
    { h: "1. Mô hình văn hoá Hofstede (theo bài đọc) – 4 cặp yếu tố",
      body: `<p>Giáo sư Geert Hofstede (Hà Lan) nghiên cứu giá trị nơi làm việc từ dữ liệu nhân viên IBM ở 74 quốc gia/vùng. So sánh các yếu tố văn hoá giúp <b>dự đoán khó khăn</b> khi làm việc xuyên văn hoá.</p>
      <table class="t"><tr><th>Cặp</th><th>Đặc điểm</th><th>Ví dụ</th></tr>
      <tr><td><b>Hierarchical</b> vs <b>Egalitarian</b></td><td>Thứ bậc: tôn trọng quyền lực, quan hệ <b>formal</b> với sếp, ít nhận trách nhiệm. Bình đẳng: <b>liberal</b>, sếp giao trách nhiệm, giao lưu với nhân viên.</td><td>Malaysia, Indonesia vs Australia, Denmark</td></tr>
      <tr><td><b>Individualistic</b> vs <b>Collectivist</b></td><td>Cá nhân: quyền cá nhân, tự do ngôn luận, mục tiêu cá nhân. Tập thể: nhóm/gia đình quan trọng hơn cả kinh doanh, khen thưởng theo nhóm.</td><td>USA, Netherlands vs Korea, Colombia</td></tr>
      <tr><td><b>Masculine</b> vs <b>Feminine</b></td><td>Nam tính: cạnh tranh, quyết đoán, tích luỹ của cải, "live to work", nghỉ ngắn. Nữ tính: gia đình, quan hệ, chất lượng sống, đàm phán, "work to live", nghỉ dài, giờ linh hoạt.</td><td>Brazil, Mexico vs Sweden, Finland</td></tr>
      <tr><td><b>Cautious</b> vs <b>Risk-taking</b></td><td>Thận trọng: lịch sử lâu, tôn giáo, chống ý tưởng mới, theo luật <b>strict</b>. Chấp nhận rủi ro: lịch sử trẻ, <b>open</b> với ý tưởng mới, <b>accepting</b> of change.</td><td>Greece, Portugal vs Jamaica, Singapore</td></tr></table>
      <p class="tip">"When in Rome, do as the Romans do" = Nhập gia tuỳ tục.</p>`},
    { h: "2. Tính từ + giới từ (dependent prepositions) – hay thi",
      body: `<ul><li><b>sensitive to</b> sb's feelings – nhạy cảm với</li><li><b>adjust to</b> – thích nghi với (động từ)</li><li><b>familiar with</b> – quen thuộc với</li><li><b>aware of</b> – nhận thức được</li><li><b>respectful of</b> – tôn trọng</li><li><b>informed about</b> – được thông tin về</li><li><b>used to</b> + V-ing/N – quen với</li><li><b>tolerant of</b> – khoan dung với</li></ul>`},
    { h: "3. Narrative tenses – Thì kể chuyện",
      body: `<table class="t"><tr><th>Thì</th><th>Dùng để</th><th>Ví dụ</th></tr>
      <tr><td><b>Past continuous</b> (was/were + V-ing)</td><td>Bối cảnh mở đầu câu chuyện; hành động đang diễn ra thì bị hành động khác xen vào</td><td>It was raining hard… / While he was standing there, another motorist saw him.</td></tr>
      <tr><td><b>Past simple</b></td><td>Các hành động, sự kiện chính nối tiếp</td><td>The car got a flat tyre, and the chauffeur pulled over.</td></tr>
      <tr><td><b>Past perfect</b> (had + V3)</td><td>Hành động xảy ra TRƯỚC một hành động quá khứ khác</td><td>He realized that he had left the tool kit behind.</td></tr></table>`},
    { h: "4. Cụm từ nối khi kể sự việc (critical incidents)",
      body: `<ul><li><b>As time went by</b> – thời gian trôi qua</li><li><b>That was when</b> – đó là lúc</li><li><b>It wasn't until … that</b> – mãi đến khi … mới</li><li><b>But then</b> – nhưng rồi</li><li><b>In the end</b> – cuối cùng</li><li><b>So that was</b> – vậy là</li><li><b>So what</b> (did you do)? – thế rồi (anh làm gì)?</li><li><b>because of / due to</b> + N – vì</li><li><b>It came about</b> – chuyện xảy ra (là do)</li></ul>
      <p><b>Critical incident</b> = tình huống giao tiếp gây khó hiểu/hiểu lầm (lỗi ngôn ngữ, faux pas văn hoá), làm lộ ra khác biệt niềm tin, giá trị văn hoá.</p>`}
  ],
  readings: [
    { t: "Working across cultures (tóm tắt)", s: `<p>Làm việc, tiếp khách, đàm phán với đồng nghiệp khác văn hoá có thể khó; một hiểu lầm có thể phá hỏng nhiều tháng làm việc. Theo Hofstede, so sánh các yếu tố văn hoá của mình với văn hoá khác giúp dự đoán khó khăn. Bốn cặp yếu tố: Hierarchical/Egalitarian; Individualistic/Collectivist; Masculine/Feminine; Cautious/Risk-taking (xem phần Bản chất).</p>`},
    { t: "Story – The billionaire and the motorist (tóm tắt)", s: `<p>Một tối tháng 12, tỷ phú Mỹ được chở trên cao tốc New Jersey trời mưa to. Xe bị xẹp lốp; tài xế phát hiện <b>đã để quên</b> bộ đồ nghề. Một người lái xe đi ngang dừng lại giúp thay bánh. Tỷ phú hỏi có thể cảm ơn thế nào – người đàn ông nói vợ anh có lẽ thích một bó hoa nhỏ. Hai tuần sau, bó hoa đến nhà kèm lời nhắn: toàn bộ khoản vay mua nhà của anh <b>đã được trả hết</b>.</p>`}

window.VOCAB = VOCAB_RAW.map((v, i) => ({ id: i, w: v[0], pos: v[1], vn: v[2], ex: v[3], u: v[4] }));

<script>
(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* ---------- storage ---------- */
  const KEY = "emba-english-v1";
  let P = { ex: {}, vocab: {}, exams: [] };
  try { const raw = localStorage.getItem(KEY); if (raw) P = Object.assign(P, JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };

  /* ---------- helpers ---------- */
  const norm = s => String(s).toLowerCase()
    .replace(/[’‘`´]/g, "'").replace(/[“”"]/g, "")
    .replace(/[.,!?;:()…]/g, " ").replace(/\s+/g, " ").trim();
  function isCorrect(input, answerSpec) {
    const u = norm(input); if (!u) return false;
    return answerSpec.split("|").some(a => {
      const n = norm(a);
      if (u === n) return true;
      if (n.length >= 6 && u.includes(n) && u.length <= n.length + 14) return true;
      // accept contraction / full form variants
      const exp = x => x.replace(/'ll\b/g, " will").replace(/'re\b/g, " are").replace(/'d\b/g, " would").replace(/'ve\b/g, " have").replace(/'s\b/g, " is").replace(/\s+/g, " ").trim();
      return exp(u) === exp(n) || (n.length >= 6 && exp(u).includes(exp(n)) && u.length <= n.length + 18);
    });
  }
  const first = spec => spec.split("|")[0];
  function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
  function shuffle(arr, rnd = Math.random) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  const uniq = a => Array.from(new Set(a));
  function speak(t) {
    try {
      const clean = String(t).replace(/\([^)]*\)/g, "").replace(/_+/g, " blank ");
      const u = new SpeechSynthesisUtterance(clean); u.lang = "en-GB"; u.rate = 0.92;
      const v = speechSynthesis.getVoices().find(v => /en[-_]GB/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /^en/i.test(v.lang));
      if (v) u.voice = v;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }
  window.__speak = speak;
  const spk = t => `<button class="spk" title="Nghe phát âm" data-say="${esc(t)}">🔊</button>`;

  const ALL_EX = []; UNITS.forEach(u => u.exercises.forEach(e => { e.unit = u.id; ALL_EX.push(e); }));
  const gradable = e => ["fill", "match", "mcq"].includes(e.type);
  function unitProgress(u) {
    const ex = u.exercises.filter(gradable); if (!ex.length) return 0;
    let done = 0; ex.forEach(e => { const r = P.ex[e.id]; if (r) done += r.best / r.total; });
    return Math.round(done / ex.length * 100);
  }
  const vocabLearned = list => list.filter(v => (P.vocab[v.id] || 0) >= 3).length;

  /* ---------- exercise rendering ---------- */
  function renderExercise(e) {
    const r = P.ex[e.id];
    const badge = r ? `<span class="badge ${r.best === r.total ? "ok" : ""}">Tốt nhất: ${r.best}/${r.total}</span>` : "";
    let body = "";
    if (e.type === "info") body = `<div class="info">${e.html}</div>`;
    if (e.type === "match") {
      const rnd = seeded(e.id);
      const opts = shuffle(uniq(e.items.map(i => i.r.trim()).concat(e.extra || [])), rnd);
      body = `<ol class="items">` + e.items.map((it, k) => `<li class="row" data-k="${k}">
        <div class="q">${esc(it.l)}</div>
        <select><option value="">— chọn —</option>${opts.map(o => `<option>${esc(o)}</option>`).join("")}</select>
        <div class="fb"></div></li>`).join("") + `</ol>`;
    }
    if (e.type === "fill") {
      body = `<ol class="items">` + e.items.map((it, k) => `<li class="row" data-k="${k}">
        <div class="q">${esc(it.q)}</div>
        <div class="inputs">${it.a.map((_, b) => `<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${it.a.length > 1 ? "ô " + (b + 1) : "trả lời"}">`).join("")}</div>
        <div class="fb"></div></li>`).join("") + `</ol>`;
    }
    if (e.type === "mcq") {
      body = `<ol class="items">` + e.items.map((it, k) => `<li class="row" data-k="${k}">
        <div class="q">${esc(it.q)}</div>
        <div class="opts">${it.o.map((o, j) => `<label class="opt"><input type="radio" name="${e.id}-${k}" value="${j}"><span>${esc(o)}</span></label>`).join("")}</div>
        <div class="fb"></div></li>`).join("") + `</ol>`;
    }
    if (e.type === "open") {
      body = `<ol class="items">` + e.items.map((it, k) => `<li class="row open">
        <div class="q">${esc(it.q)} ${spk(it.q)}</div>
        <textarea rows="2" placeholder="Viết câu trả lời của bạn (không bắt buộc)…"></textarea>
        <details><summary>Xem bài mẫu</summary><div class="model">${esc(it.model).replace(/\n/g, "<br>")} ${spk(it.model)}</div></details></li>`).join("") + `</ol>`;
    }
    const actions = gradable(e) ? `<div class="actions"><button class="btn primary" data-act="check">Kiểm tra</button><button class="btn" data-act="show">Xem đáp án</button><button class="btn ghost" data-act="reset">Làm lại</button><span class="score"></span></div>` : "";
    return `<section class="card ex" id="${e.id}" data-ex="${e.id}">
      <header><h3>${esc(e.title)}</h3>${badge}</header>
      ${e.intro ? `<p class="intro">${esc(e.intro)}</p>` : ""}${body}${actions}</section>`;
  }

  function gradeExercise(sec, reveal) {
    const e = ALL_EX.find(x => x.id === sec.dataset.ex); let ok = 0, total = 0;
    $$(".row", sec).forEach(row => {
      const it = e.items[+row.dataset.k]; const fb = $(".fb", row); let good = false, ans = "";
      if (e.type === "match") {
        const sel = $("select", row); ans = it.r.trim();
        if (reveal) sel.value = ans;
        good = sel.value === ans;
      } else if (e.type === "fill") {
        const ins = $$("input", row); good = true;
        ins.forEach((inp, b) => { if (reveal) inp.value = first(it.a[b]); const g = isCorrect(inp.value, it.a[b]); inp.classList.toggle("good", g); inp.classList.toggle("bad", !g); if (!g) good = false; });
        ans = it.a.map(first).join("  /  ");
      } else if (e.type === "mcq") {
        if (reveal) { const rb = $$("input", row)[it.a]; rb.checked = true; }
        const sel = $("input:checked", row); good = sel && +sel.value === it.a; ans = it.o[it.a];
        $$(".opt", row).forEach((l, j) => { l.classList.toggle("right", j === it.a && (reveal || !!sel)); l.classList.toggle("wrong", !!sel && +sel.value === j && j !== it.a); });
      }
      total++; if (good) ok++;
      row.classList.toggle("ok", good); row.classList.toggle("no", !good);
      fb.innerHTML = (good ? `<span class="okt">✔ Đúng</span>` : `<span class="not">✘ Đáp án: <b>${esc(ans)}</b></span>`) + (it.ex ? `<div class="exp">💡 ${esc(it.ex)}</div>` : "");
    });
    $(".score", sec).textContent = reveal ? "Đã hiện đáp án" : `Điểm: ${ok}/${total}`;
    if (!reveal) {
      const prev = P.ex[e.id]; P.ex[e.id] = { best: Math.max(ok, prev ? prev.best : 0), total, last: ok, t: Date.now() }; save();
      const head = $("header", sec); let b = $(".badge", head); if (!b) { b = document.createElement("span"); head.appendChild(b); }
      b.className = "badge" + (P.ex[e.id].best === total ? " ok" : ""); b.textContent = `Tốt nhất: ${P.ex[e.id].best}/${total}`;
    }
  }

  /* ---------- pages ---------- */
  const main = () => $("#main");
  function setActiveNav(h) { $$("#nav a").forEach(a => a.classList.toggle("active", h.startsWith(a.getAttribute("href")))); }

  function pageHome() {
    const totalEx = ALL_EX.filter(gradable).length, doneEx = ALL_EX.filter(e => gradable(e) && P.ex[e.id]).length;
    const learned = vocabLearned(VOCAB);
    return `<div class="hero"><div><p class="kicker">Đại học Thương Mại · Chương trình eMBA</p><h1>English for Business</h1>
      <p>Học từng unit theo 4 bước: <b>Hiểu bản chất → Đọc tóm tắt → Làm bài tập có giải thích → Luyện nói/viết</b>. Ôn từ vựng bằng flashcard và làm đề thi thử trộn câu hỏi từ cả 8 unit.</p>
      <div class="stats"><div><b>${doneEx}/${totalEx}</b><span>bài tập đã làm</span></div><div><b>${learned}/${VOCAB.length}</b><span>từ đã thuộc</span></div><div><b>${P.exams.length ? P.exams[P.exams.length - 1].pct + "%" : "—"}</b><span>đề thi thử gần nhất</span></div></div></div></div>
      <h2 class="sec">8 Units</h2><div class="grid">${UNITS.map(u => `<a class="ucard" href="#unit/${u.id}/concepts">
        <div class="unum">Unit ${u.id}</div><h3>${esc(u.title)}</h3><p class="vn">${esc(u.vn)}</p><p class="goal">${esc(u.goal)}</p>
        <div class="bar"><i style="width:${unitProgress(u)}%"></i></div><small>${unitProgress(u)}% bài tập · ${vocabLearned(VOCAB.filter(v => v.u === u.id))}/${VOCAB.filter(v => v.u === u.id).length} từ</small></a>`).join("")}</div>
      <h2 class="sec">Chiến lược để đạt điểm tối đa</h2>
      <div class="card tips"><ol>
        <li><b>Mỗi unit:</b> đọc tab <i>Bản chất</i> trước (hiểu vì sao), rồi mới làm <i>Bài tập</i>. Làm sai → đọc dòng 💡 giải thích.</li>
        <li><b>Lặp lại đến khi đạt 100%</b> mọi bài tập (nút "Làm lại"). Điểm tốt nhất được lưu trên trình duyệt này.</li>
        <li><b>Từ vựng:</b> mỗi ngày 15 phút flashcard, ưu tiên từ "chưa thuộc". Học theo cụm (collocation): <i>comply with regulations, raise capital, a sharp rise</i>.</li>
        <li><b>Ngữ pháp trọng tâm:</b> mô tả xu hướng (U1), tiền tố phủ định (U5), 4 cách nói tương lai (U6), hiện tại hoàn thành đơn/tiếp diễn (U7), thì kể chuyện + tính từ đi với giới từ (U8).</li>
        <li><b>Kiến thức chuyên môn hay ra:</b> GDP vs GNP, surplus vs deficit, 3 khu vực kinh tế, IPO/underwrite/rights issue, 7 phần của annual report, balance sheet (debtors vs creditors), Theory X/Y, Hofstede.</li>
        <li><b>Thi nói/viết:</b> học thuộc các bài mẫu ở tab <i>Thảo luận</i>, thay bằng ví dụ Việt Nam/công ty của bạn.</li>
        <li><b>Tuần trước khi thi:</b> làm <a href="#exam">Đề thi thử</a> 50 câu, mục tiêu ≥ 90% hai lần liên tiếp.</li></ol></div>`;
  }

  const TABS = [["concepts", "Bản chất"], ["readings", "Bài đọc"], ["exercises", "Bài tập"], ["discussion", "Nói & Viết"], ["vocab", "Từ vựng"]];
  function pageUnit(id, tab) {
    const u = UNITS.find(x => x.id === +id); if (!u) return pageHome();
    tab = tab || "concepts";
    let c = "";
    if (tab === "concepts") c = u.concepts.map(k => `<section class="card concept"><h3>${k.h}</h3>${k.body}</section>`).join("");
    if (tab === "readings") c = `<p class="note">Tóm tắt tiếng Việt các bài đọc — đọc song song với tài liệu gốc để hiểu nhanh và trả lời câu hỏi đúng ý.</p>` + u.readings.map(r => `<section class="card"><h3>${esc(r.t)}</h3>${r.s}</section>`).join("");
    if (tab === "exercises") c = `<p class="note">Có ${u.exercises.filter(gradable).length} bài tự chấm. Ô điền chấp nhận nhiều cách viết đúng; không phân biệt hoa/thường.</p>
      <nav class="toc">${u.exercises.map(e => `<a href="#unit/${u.id}/exercises/${e.id}">${esc(e.title.split(":")[0])}${P.ex[e.id] ? (P.ex[e.id].best === P.ex[e.id].total ? " ✔" : " ·") : ""}</a>`).join("")}</nav>` + u.exercises.map(renderExercise).join("");
    if (tab === "discussion") c = `<p class="note">Câu hỏi thảo luận/viết kèm bài mẫu chuẩn. Tự trả lời trước, sau đó mở bài mẫu để so sánh; bấm 🔊 để nghe.</p>` + renderExercise({ id: "disc" + u.id, type: "open", title: "Discussion & model answers", items: u.discussion });
    if (tab === "vocab") c = vocabTable(VOCAB.filter(v => v.u === u.id)) + `<p><a class="btn primary" href="#vocab/cards/${u.id}">Học flashcard Unit ${u.id}</a> <a class="btn" href="#vocab/quiz/${u.id}">Kiểm tra từ vựng Unit ${u.id}</a></p>`;
    return `<div class="uhead"><div class="unum">Unit ${u.id}</div><h1>${esc(u.title)} <span class="vn">— ${esc(u.vn)}</span></h1><p class="goal">🎯 ${esc(u.goal)}</p>
      <div class="bar"><i style="width:${unitProgress(u)}%"></i></div></div>
      <div class="tabs">${TABS.map(([k, n]) => `<a class="${k === tab ? "on" : ""}" href="#unit/${u.id}/${k}">${n}</a>`).join("")}</div>
      <div class="tabbody">${c}</div>
      <div class="pager">${u.id > 1 ? `<a class="btn ghost" href="#unit/${u.id - 1}/${tab}">← Unit ${u.id - 1}</a>` : "<span></span>"}${u.id < 8 ? `<a class="btn ghost" href="#unit/${u.id + 1}/${tab}">Unit ${u.id + 1} →</a>` : ""}</div>`;
  }

  function vocabTable(list) {
    return `<div class="card"><div class="vtools"><input id="vsearch" type="search" placeholder="Tìm từ (Anh hoặc Việt)…"><span class="muted">${list.length} từ</span></div>
      <div class="vtable">${list.map(v => `<div class="vrow" data-s="${esc((v.w + " " + v.vn + " " + v.ex).toLowerCase())}">
        <div class="vw"><b>${esc(v.w)}</b> <i>${esc(v.pos)}</i> ${spk(v.w)}</div><div class="vv">${esc(v.vn)}</div><div class="ve">${esc(v.ex)}</div>
        <div class="vs">${(P.vocab[v.id] || 0) >= 3 ? `<span class="badge ok">đã thuộc</span>` : `<span class="badge">U${v.u}</span>`}</div></div>`).join("")}</div></div>`;
  }

  /* ---------- vocabulary: cards / quiz / list ---------- */
  function unitSelect(cur, base) {
    return `<div class="seg">${[["all", "Tất cả"]].concat(UNITS.map(u => [String(u.id), "U" + u.id])).map(([k, n]) => `<a class="${String(cur) === k ? "on" : ""}" href="#${base}/${k}">${n}</a>`).join("")}</div>`;
  }
  let card = null, cardFlipped = false;
  function pickCard(list) {
    const minBox = Math.min(...list.map(v => P.vocab[v.id] || 0));
    const pool = list.filter(v => (P.vocab[v.id] || 0) <= minBox + 1 && (!card || v.id !== card.id));
    return pool[Math.floor(Math.random() * pool.length)] || list[0];
  }
  function pageVocab(mode, unit) {
    mode = mode || "cards"; unit = unit || "all";
    const list = unit === "all" ? VOCAB : VOCAB.filter(v => v.u === +unit);
    const sub = `<div class="tabs">${[["cards", "Flashcard"], ["quiz", "Kiểm tra"], ["list", "Danh sách"]].map(([k, n]) => `<a class="${k === mode ? "on" : ""}" href="#vocab/${k}/${unit}">${n}</a>`).join("")}</div>` + unitSelect(unit, "vocab/" + mode);
    let c = "";
    if (mode === "list") c = vocabTable(list);
    if (mode === "cards") {
      if (!card || !list.includes(card)) card = pickCard(list); cardFlipped = false;
      const learned = vocabLearned(list);
      c = `<div class="fcwrap"><div class="muted center">Đã thuộc ${learned}/${list.length} từ · Hộp ghi nhớ của từ này: ${P.vocab[card.id] || 0}/5</div>
        <div class="bar"><i style="width:${Math.round(learned / list.length * 100)}%"></i></div>
        <div class="flash" id="flash" tabindex="0"><div class="front"><div class="fw">${esc(card.w)}</div><div class="fp">${esc(card.pos)} · Unit ${card.u}</div><div class="hint">Bấm vào thẻ (hoặc phím Space) để lật</div></div>
        <div class="back"><div class="fv">${esc(card.vn)}</div><div class="fe">${esc(card.ex)}</div></div></div>
        <div class="fcbtns"><button class="btn" data-say="${esc(card.w)}">🔊 Nghe</button><button class="btn bad" id="fcNo">✘ Chưa thuộc (1)</button><button class="btn good" id="fcYes">✔ Đã thuộc (2)</button></div>
        <p class="muted center">Thuật toán lặp lại ngắt quãng: từ "chưa thuộc" sẽ xuất hiện lại thường xuyên hơn. Từ đạt hộp ≥ 3 được tính là đã thuộc.</p></div>`;
    }
    if (mode === "quiz") c = `<div id="vquiz"></div>`;
    setTimeout(() => {
      if (mode === "quiz") startVocabQuiz(list);
      if (mode === "cards") bindCards(list);
    });
    return `<h1>Từ vựng <span class="vn">— ${VOCAB.length} từ & cụm từ theo 8 unit</span></h1>${sub}${c}`;
  }
  function bindCards(list) {
    const f = $("#flash"); if (!f) return;
    const flip = () => { cardFlipped = !cardFlipped; f.classList.toggle("flipped", cardFlipped); if (cardFlipped) speak(card.w); };
    f.onclick = flip;
    const next = good => { P.vocab[card.id] = good ? Math.min(5, (P.vocab[card.id] || 0) + 1) : 1; save(); card = pickCard(list); route(); };
    $("#fcYes").onclick = () => next(true); $("#fcNo").onclick = () => next(false);
    document.onkeydown = ev => {
      if (!$("#flash")) { document.onkeydown = null; return; }
      if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
      if (ev.code === "Space") { ev.preventDefault(); flip(); } else if (ev.key === "1") next(false); else if (ev.key === "2") next(true);
    };
  }
  function makeVocabQ(v, pool) {
    const others = shuffle(pool.filter(x => x.id !== v.id)).slice(0, 3);
    const t = Math.floor(Math.random() * 4);
    if (t === 0) return { type: "mcq", q: `Nghĩa của "${v.w}" là gì?`, o: shuffle([v.vn, ...others.map(o => o.vn)]), ans: v.vn, ex: `${v.w} = ${v.vn}. ${v.ex}`, say: v.w };
    if (t === 1) return { type: "mcq", q: `Từ nào có nghĩa "${v.vn}"?`, o: shuffle([v.w, ...others.map(o => o.w)]), ans: v.w, ex: v.ex };
    if (t === 2) return { type: "mcq", q: `Which word matches: "${v.ex}"?`, o: shuffle([v.w, ...others.map(o => o.w)]), ans: v.w, ex: `${v.w} = ${v.vn}` };
    const typed = v.w.split(/\s*[\/(]/)[0].trim();
    return { type: "type", q: `Gõ từ tiếng Anh cho: "${v.vn}" (${v.pos}) — gợi ý: ${typed[0]}${"_".repeat(Math.max(0, typed.length - 1)).replace(/_/g, "_ ")}`, ans: typed, ex: `${v.w} = ${v.vn}. ${v.ex}` };
  }
  function startVocabQuiz(list) {
    const pool = list.length >= 4 ? list : VOCAB;
    const qs = shuffle(list).slice(0, Math.min(10, list.length)).map(v => makeVocabQ(v, pool));
    runQuiz($("#vquiz"), qs, "Kiểm tra từ vựng", null);
  }

  /* ---------- generic quiz runner (vocab quiz + exam) ---------- */
  function runQuiz(el, qs, title, onDone, timerMin) {
    let i = 0, score = 0; const wrong = []; const t0 = Date.now(); let timerId = null;
    function draw() {
      if (i >= qs.length) return finish();
      const q = qs[i];
      el.innerHTML = `<div class="card quiz"><div class="qtop"><b>${esc(title)}</b><span>Câu ${i + 1}/${qs.length} · Đúng ${score}</span><span id="qtimer"></span></div>
        <div class="bar"><i style="width:${i / qs.length * 100}%"></i></div>
        ${q.src ? `<div class="muted">${esc(q.src)}</div>` : ""}<div class="qq">${esc(q.q)} ${q.say ? spk(q.say) : ""}</div>
        ${q.type === "mcq" ? `<div class="qopts">${q.o.map((o, j) => `<button class="qopt" data-j="${j}">${String.fromCharCode(65 + j)}. ${esc(o)}</button>`).join("")}</div>`
          : `<div class="qtype"><input id="qin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ đáp án rồi Enter"><button class="btn primary" id="qok">Trả lời</button></div>`}
        <div class="qfb"></div></div>`;
      tick();
      const answer = (given, good) => {
        if (good) score++; else wrong.push({ q, given });
        const fb = $(".qfb", el);
        fb.innerHTML = (good ? `<div class="okt">✔ Chính xác!</div>` : `<div class="not">✘ Đáp án đúng: <b>${esc(q.type === "mcq" ? q.ans : first(q.ans))}</b></div>`) + (q.ex ? `<div class="exp">💡 ${esc(q.ex)}</div>` : "") + `<button class="btn primary" id="qnext">${i + 1 < qs.length ? "Câu tiếp →" : "Xem kết quả"}</button>`;
        $("#qnext").onclick = () => { i++; draw(); }; $("#qnext").focus();
      };
      if (q.type === "mcq") $$(".qopt", el).forEach(b => b.onclick = () => {
        const j = +b.dataset.j, good = q.o[j] === q.ans;
        $$(".qopt", el).forEach((x, k) => { x.disabled = true; if (q.o[k] === q.ans) x.classList.add("right"); });
        if (!good) b.classList.add("wrong"); answer(q.o[j], good);
      });
      else { const inp = $("#qin"); inp.focus(); const go = () => { if ($("#qnext")) return; inp.disabled = true; const g = isCorrect(inp.value, q.ans); inp.classList.add(g ? "good" : "bad"); answer(inp.value, g); };
        $("#qok").onclick = go; inp.onkeydown = ev => { if (ev.key === "Enter") go(); }; }
    }
    function tick() {
      if (!timerMin) return; const tEl = $("#qtimer"); if (!tEl) return;
      const left = timerMin * 60 - Math.floor((Date.now() - t0) / 1000);
      if (left <= 0) { clearInterval(timerId); i = qs.length; return finish(true); }
      tEl.textContent = `⏱ ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
      if (!timerId) timerId = setInterval(() => { if (!document.body.contains(el)) return clearInterval(timerId); tick(); }, 1000);
    }
    function finish(timeout) {
      clearInterval(timerId);
      const pct = Math.round(score / qs.length * 100); if (onDone) onDone(score, qs.length, pct);
      const mins = Math.round((Date.now() - t0) / 60000);
      el.innerHTML = `<div class="card result"><h2>${timeout ? "Hết giờ! " : ""}Kết quả: ${score}/${qs.length} (${pct}%)</h2>
        <p>${pct >= 90 ? "🎉 Xuất sắc! Bạn đã sẵn sàng." : pct >= 70 ? "👍 Khá tốt. Ôn lại các câu sai bên dưới." : "📚 Cần ôn thêm. Đọc lại tab Bản chất của các unit có câu sai."} · Thời gian: ~${mins} phút</p>
        <button class="btn primary" id="again">Làm lượt mới</button>
        ${wrong.length ? `<h3>Các câu cần ôn lại (${wrong.length})</h3><ol class="review">${wrong.map(w => `<li><div>${w.q.src ? `<span class="muted">${esc(w.q.src)}</span><br>` : ""}${esc(w.q.q)}</div>
          <div class="not">Bạn chọn: ${esc(w.given || "(bỏ trống)")} → Đúng: <b>${esc(w.q.type === "mcq" ? w.q.ans : first(w.q.ans))}</b></div>${w.q.ex ? `<div class="exp">💡 ${esc(w.q.ex)}</div>` : ""}</li>`).join("")}</ol>` : ""}</div>`;
      $("#again").onclick = () => route(true);
    }
    draw();
  }

  /* ---------- exam ---------- */
  function buildExamPool(units, withVocab) {
    const pool = [];
    ALL_EX.filter(e => units.includes(e.unit)).forEach(e => {
      const src = `Unit ${e.unit} · ${e.title}`;
      if (e.type === "mcq") e.items.forEach(it => pool.push({ type: "mcq", q: it.q, o: shuffle(it.o), ans: it.o[it.a], ex: it.ex, src }));
      if (e.type === "match") e.items.forEach(it => {
        const others = shuffle(uniq(e.items.map(x => x.r.trim()).filter(r => r !== it.r.trim()))).slice(0, 3);
        pool.push({ type: "mcq", q: it.l, o: shuffle([it.r.trim(), ...others]), ans: it.r.trim(), ex: it.ex, src });
      });
      if (e.type === "fill") e.items.forEach(it => { if (it.a.length === 1) pool.push({ type: "type", q: it.q, ans: it.a[0], ex: it.ex, src }); });
    });
    if (withVocab) { const vl = VOCAB.filter(v => units.includes(v.u)); shuffle(vl).slice(0, Math.ceil(vl.length / 3)).forEach(v => { const q = makeVocabQ(v, vl); q.src = `Từ vựng Unit ${v.u}`; pool.push(q); }); }
    return pool;
  }
  function pageExam() {
    const hist = P.exams.slice(-5).reverse();
    setTimeout(() => {
      $("#examGo").onclick = () => {
        const units = $$(".eu:checked").map(x => +x.value); if (!units.length) { $("#examBox").innerHTML = `<p class="warn">Hãy chọn ít nhất 1 unit.</p>`; return; }
        const n = +$("#en").value, withV = $("#ev").checked, timed = $("#et").checked;
        const qs = shuffle(buildExamPool(units, withV)).slice(0, n);
        runQuiz($("#examBox"), qs, "Đề thi thử", (s, t, pct) => { P.exams.push({ s, t, pct, d: Date.now(), units }); save(); }, timed ? Math.ceil(qs.length * 0.75) : 0);
        $("#examBox").scrollIntoView({ behavior: "smooth" });
      };
    });
    return `<h1>Luyện thi <span class="vn">— đề trộn ngẫu nhiên từ toàn bộ bài tập & từ vựng</span></h1>
      <div class="card"><div class="examset"><div><b>Chọn unit:</b><div class="chk">${UNITS.map(u => `<label><input type="checkbox" class="eu" value="${u.id}" checked> U${u.id}</label>`).join("")}</div></div>
      <div><b>Số câu:</b> <select id="en"><option>20</option><option selected>30</option><option>50</option><option>80</option></select></div>
      <div><label><input type="checkbox" id="ev" checked> Có câu hỏi từ vựng</label><br><label><input type="checkbox" id="et"> Tính giờ (45 giây/câu)</label></div>
      <button class="btn primary big" id="examGo">Bắt đầu làm bài</button></div>
      ${hist.length ? `<p class="muted">Lịch sử: ${hist.map(h => `${new Date(h.d).toLocaleDateString("vi-VN")} – <b>${h.pct}%</b> (${h.s}/${h.t})`).join(" · ")}</p>` : ""}</div>
      <div id="examBox"></div>
      <h2 class="sec">Câu hỏi lý thuyết hay gặp (trả lời ngắn bằng tiếng Anh)</h2>
      ${renderExercise({ id: "examTheory", type: "open", title: "Short-answer theory questions", items: THEORY })}`;
  }
  const THEORY = [
    { q: "What is the difference between GDP and GNP?", model: "GDP is the value of all finished goods and services produced within a country's borders. GNP is the value of goods and services produced by a country's nationals, wherever they are." },
    { q: "What is a trade deficit?", model: "A trade deficit is when a country's imports are larger than its exports, so the balance of trade is negative." },
    { q: "Name the three economic sectors and give an example of each.", model: "The primary sector provides raw materials (e.g. agriculture, mining); the secondary sector manufactures finished products (e.g. steel, textiles); the service sector provides support activities (e.g. banking, retailing)." },
    { q: "What are the two main functions of a stock market?", model: "It is a place for companies to raise new capital by issuing shares (primary listing/IPO) and a platform for investors to trade existing shares (secondary market)." },
    { q: "What does it mean to underwrite an IPO?", model: "The investment bank promises to buy any shares that are not sold to investors." },
    { q: "Why does a share price fall after a rights issue?", model: "Because new shares are issued, so each existing share represents a smaller percentage of the company (dilution)." },
    { q: "What are the main sections of an annual report?", model: "Chairman's statement, outlook, corporate governance, statement of directors' responsibilities, independent auditor's report, financial statements and notes to the accounts." },
    { q: "What is the difference between debtors and creditors?", model: "Debtors are customers who owe money to the company (a current asset). Creditors are people the company owes money to, such as suppliers (a liability)." },
    { q: "Explain Theory X and Theory Y.", model: "Theory X managers believe people must be directed and controlled through an authoritarian system and close supervision. Theory Y managers believe individual and organizational goals can be integrated, so committed people will exercise self-direction and self-control." },
    { q: "What is empowerment?", model: "Empowerment means giving employees the right to use their own initiative and take decisions without asking managers first." },
    { q: "What makes a business ethical?", model: "It acts responsibly, complies with and goes beyond regulations, reduces its impact on the environment, treats workers and suppliers fairly (fair trade), supports the community and stays true to its principles." },
    { q: "When do we use the present continuous for the future?", model: "For fixed arrangements or appointments, e.g. 'I'm meeting Mrs. Brasseler at 3.30.'" },
    { q: "Describe Hofstede's four pairs of cultural factors.", model: "Hierarchical vs egalitarian, individualistic vs collectivist, masculine vs feminine, and cautious vs risk-taking." }
  ];

  /* ---------- grammar & skills ---------- */
  const GRAMMAR_REFS = [[1, 3], [5, 1], [6, 2], [6, 3], [7, 1], [7, 2], [7, 3], [8, 1], [8, 2], [8, 3]];
  function pageGrammar() {
    return `<h1>Ngữ pháp & Kỹ năng <span class="vn">— tổng hợp trọng tâm của 8 unit</span></h1>
      <nav class="toc">${GRAMMAR_REFS.map(([u, k], n) => `<a href="#grammar/g${n}">U${u}: ${esc(UNITS[u - 1].concepts[k].h.replace(/^\d+\.\s*/, "").split("–")[0])}</a>`).join("")}<a href="#grammar/w1">Mẫu viết: mô tả biểu đồ</a><a href="#grammar/w2">Mẫu nói: giới thiệu & thảo luận</a></nav>
      ${GRAMMAR_REFS.map(([u, k], n) => `<section class="card concept" id="g${n}"><div class="unum">Unit ${u}</div><h3>${UNITS[u - 1].concepts[k].h}</h3>${UNITS[u - 1].concepts[k].body}</section>`).join("")}
      <section class="card concept" id="w1"><h3>Mẫu viết: Mô tả biểu đồ / số liệu (describing trends)</h3>
      <p><b>Cấu trúc 3 phần:</b> (1) Giới thiệu biểu đồ: <i>The graph shows… between… and…</i> (2) Xu hướng chính: <i>Overall, … rose/fell…</i> (3) Chi tiết số liệu với from/to/by + adverb.</p>
      <div class="model">The graph shows the UK inflation rate from January to October. Overall, inflation increased during the period. It stood at 1.8% in January and rose steadily to 2.4% in August. After that, it increased sharply to 3.4% in October. By contrast, interest rates fell dramatically from 5% in 2007 to 0.75% in 2009, and then remained stable. ${spk("The graph shows the UK inflation rate from January to October. Overall, inflation increased during the period.")}</div>
      <p class="tip">Từ nối hữu ích: <i>Overall, By contrast, However, After that, In comparison, while</i>. Động từ thêm: <i>remain stable, level off, reach a peak of, hit a low of</i>.</p></section>
      <section class="card concept" id="w2"><h3>Mẫu nói: Giới thiệu & trình bày quan điểm</h3>
      <ul><li><b>Nêu ý kiến:</b> In my opinion, … / I strongly believe that … / From my experience, …</li>
      <li><b>Đưa lý do:</b> The main reason is that … / This is because … / For example, …</li>
      <li><b>So sánh:</b> Compared with …, … / Whereas …, … / On the other hand, …</li>
      <li><b>Đồng ý/không đồng ý lịch sự:</b> I see your point, but … / That's true to some extent, however …</li>
      <li><b>Kết luận:</b> To sum up, … / All in all, …</li></ul>
      <div class="model">In my opinion, the most important quality of a manager is being decisive. This is because teams need clear direction, especially in a crisis. For example, in my company, our director made a quick decision to move online during the pandemic, which saved the business. On the other hand, a good manager should also be supportive and consult the team. To sum up, the best managers combine decisiveness with empathy. ${spk("In my opinion, the most important quality of a manager is being decisive.")}</div></section>`;
  }

  /* ---------- router ---------- */
  function route(force) {
    const h = (location.hash || "#home").slice(1); const parts = h.split("/");
    let html = "", anchor = null;
    if (parts[0] === "unit") { html = pageUnit(parts[1], parts[2]); anchor = parts[3]; }
    else if (parts[0] === "vocab") html = pageVocab(parts[1], parts[2]);
    else if (parts[0] === "exam") html = pageExam();
    else if (parts[0] === "grammar") { html = pageGrammar(); anchor = parts[1]; }
    else html = pageHome();
    if (parts[0] !== "vocab" || parts[1] !== "cards") document.onkeydown = null;
    main().innerHTML = html; setActiveNav("#" + h);
    document.body.classList.remove("navopen");
    if (anchor) { const a = document.getElementById(anchor); if (a) setTimeout(() => a.scrollIntoView({ behavior: "smooth", block: "start" }), 30); }
    else if (!force || force === true) window.scrollTo(0, 0);
    $$(".vtable").length && bindSearch();
  }
  function bindSearch() {
    const s = $("#vsearch"); if (!s) return;
    s.oninput = () => { const q = s.value.toLowerCase().trim(); $$(".vrow").forEach(r => r.style.display = !q || r.dataset.s.includes(q) ? "" : "none"); };
  }

  document.addEventListener("click", ev => {
    const sp = ev.target.closest("[data-say]"); if (sp) { ev.preventDefault(); ev.stopPropagation(); speak(sp.dataset.say); return; }
    const act = ev.target.closest("[data-act]"); if (act) {
      const sec = act.closest("[data-ex]");
      if (act.dataset.act === "check") gradeExercise(sec, false);
      if (act.dataset.act === "show") gradeExercise(sec, true);
      if (act.dataset.act === "reset") { $$("input[type=text]", sec).forEach(i => { i.value = ""; i.className = ""; }); $$("select", sec).forEach(s => s.value = ""); $$("input[type=radio]", sec).forEach(r => r.checked = false); $$(".row", sec).forEach(r => r.classList.remove("ok", "no")); $$(".opt", sec).forEach(o => o.classList.remove("right", "wrong")); $$(".fb", sec).forEach(f => f.innerHTML = ""); $(".score", sec).textContent = ""; }
    }
    if (ev.target.closest("#menuBtn")) document.body.classList.toggle("navopen");
    const rb = ev.target.closest("#resetAll"); if (rb) { if (rb.dataset.armed) { P = { ex: {}, vocab: {}, exams: [] }; save(); route(); rb.textContent = "Xoá tiến độ"; delete rb.dataset.armed; } else { rb.dataset.armed = "1"; rb.textContent = "Bấm lần nữa để xoá hết tiến độ"; setTimeout(() => { if (rb.dataset.armed) { delete rb.dataset.armed; rb.textContent = "Xoá tiến độ"; } }, 4000); } }
  });
  document.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && ev.target.matches(".ex input[type=text]")) { const sec = ev.target.closest("[data-ex]"); const ins = $$("input[type=text]", sec); const i = ins.indexOf(ev.target); if (i < ins.length - 1) ins[i + 1].focus(); else gradeExercise(sec, false); }
  });

  /* ---------- nav ---------- */
  $("#nav").innerHTML = `<a href="#home">🏠 Trang chủ</a><div class="navh">Units</div>` +
    UNITS.map(u => `<a href="#unit/${u.id}">${u.id}. ${esc(u.title)}</a>`).join("") +
    `<div class="navh">Ôn luyện</div><a href="#vocab">📇 Từ vựng</a><a href="#grammar">📐 Ngữ pháp & Kỹ năng</a><a href="#exam">📝 Luyện thi</a>
     <div class="navfoot"><button id="resetAll" class="linkbtn">Xoá tiến độ</button></div>`;
  window.addEventListener("hashchange", () => route());
  try { speechSynthesis.getVoices(); } catch (e) {}
  route();
})();

</script>
